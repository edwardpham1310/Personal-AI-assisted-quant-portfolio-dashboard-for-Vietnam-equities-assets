[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-vn-data"
version = "0.1.0"
description = "Vietnam Stock Market Data Pipeline — research-grade OHLCV ingestion, validation, and liquidity features"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "quant-vn-data contributors" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "duckdb>=0.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pyarrow>=15",
]

[project.optional-dependencies]
vnstock = ["vnstock>=3.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6",
]

[project.scripts]
quant-vn-data = "quant_vn_data.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
