name: lint

on:
  push:
    branches: [main]
    paths:
      - "quant-vn-dashboard/apps/api/**"
      - "quant-vn-dashboard/apps/web/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "quant-vn-dashboard/apps/api/**"
      - "quant-vn-dashboard/apps/web/**"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  backend-lint:
    name: ruff (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: quant-vn-dashboard/apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quant-vn-dashboard/apps/api/pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src tests

  backend-typecheck:
    name: mypy (apps/api, advisory)
    runs-on: ubuntu-latest
    # Advisory only — mypy is not yet wired up project-wide. Don't block CI.
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: quant-vn-dashboard/apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quant-vn-dashboard/apps/api/pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Mypy (advisory)
        continue-on-error: true
        run: python -m mypy src || echo "::warning::mypy errors present — not yet enforced."

  frontend-lint:
    name: eslint + prettier (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: quant-vn-dashboard/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 20 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: quant-vn-dashboard/apps/web/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm exec prettier --check "src/**/*.{ts,tsx,css,md}"
