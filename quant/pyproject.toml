[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-vn"
version = "0.1.0"
description = "Personal quant trading research application for Vietnam stock market"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
vnstock = ["vnstock>=3.0.0"]
ml = ["scikit-learn>=1.4.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "ipykernel>=6.29.0",
    "notebook>=7.0.0",
]

[project.scripts]
quant-vn = "quant_vn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_vn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
